# fly.toml app configuration file generated for medical-study-chatgpt on 2025-05-09T09:57:48Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'medical-study-chatgpt'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = "chat_history_volume"
  destination = "/data"
