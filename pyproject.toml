[project]
name = "medical-study-chatgpt"
version = "0.1.0"
description = ""
authors = [
    {name = "Felix Fricke",email = "f.fricke@tum.de"}
]
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "streamlit (>=1.42.2,<2.0.0)",
    "openai (>=1.65.1,<2.0.0)",
    "streamlit-chat (>=0.1.1,<0.2.0)",
    "pywebview (>=5.4,<6.0)",
    "python-dotenv (>=1.1.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.12.0"

[tool.poetry.dependencies]
streamlit-desktop-app = { git = "https://github.com/fjfricke/streamlit-desktop-app.git", branch = "main" }

